apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: {{ .Values.database.namespace }}
spec:
  serviceName: mongodb-service
  replicas: {{ .Values.database.replicaCount }}
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongo
        image: {{ .Values.database.mongoImage }}
        ports:
        - containerPort: 27017
          name: mongo
        # Mount the persistent volume directory inside the container
        volumeMounts:
        - name: datadir
          mountPath: /data/db
  # Automatically provisions a unique PVC for each MongoDB replica
  volumeClaimTemplates:
  - metadata:
      name: datadir
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: {{ .Values.database.namespace }}
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017
